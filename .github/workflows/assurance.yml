name: Assurance pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assurance-state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install EvidenceFlow
        run: python -m pip install -e .
      - name: Run deterministic permissioned workflow smoke test
        run: make pilot-policy
      - name: Verify audit chain
        run: >-
          PYTHONPATH=src python -m evidenceflow verify-audit
          --audit artifacts/pilot/audit.jsonl
