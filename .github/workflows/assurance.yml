name: Assurance pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assurance-state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install EvidenceFlow
        run: python -m pip install -e .
      - name: Run deterministic permissioned workflow smoke test
        run: make pilot-policy
      - name: Verify audit chain
        run: >-
          PYTHONPATH=src python -m evidenceflow verify-audit
          --audit artifacts/pilot/audit.jsonl
