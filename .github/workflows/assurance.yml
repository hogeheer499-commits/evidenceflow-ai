name: Assurance pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assurance-state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install EvidenceFlow
        run: python -m pip install -e .
      - name: Run deterministic permissioned workflow smoke test
        run: make pilot-policy
      - name: Verify audit chain
        run: >-
          PYTHONPATH=src python -m evidenceflow verify-audit
          --audit artifacts/pilot/audit.jsonl
