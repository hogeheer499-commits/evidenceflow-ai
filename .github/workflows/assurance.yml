name: Assurance pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Python and scanner dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install semgrep==1.162.0
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          scripts/install-scanners.sh
      - name: Refresh OSV database before isolated scan
        run: scripts/update-osv-database.sh
      - name: Run full permissioned pilot
        run: make pilot
      - name: Verify audit chain
        run: >-
          PYTHONPATH=src python -m evidenceflow verify-audit
          --audit artifacts/pilot/audit.jsonl
